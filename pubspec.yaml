name: identity_frontend
description: "TrustID - Identity Fabric Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^17.1.0

  # HTTP Client
  dio: ^5.9.2

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Form Validation
  formz: ^0.8.0
  fpdart: ^1.2.0

  # Secure Storage
  flutter_secure_storage: ^10.0.0

  # Preferences
  shared_preferences: ^2.3.4

  # Cryptography — ECDSA P-256 keypair for DID wallet
  pointycastle: ^4.0.0

  # QR Code generation — export VC as QR
  qr_flutter: ^4.1.0

  # Biometric authentication — protects private key access (Phase 1 / 4.5)
  local_auth: ^2.3.0

  # Offline cache — store VCs locally so Wallet works without network (Phase 3 / 6.4)
  hive_flutter: ^1.1.0

  # UI
  flutter_svg: ^2.2.4
  mobile_scanner: ^7.2.0

  # Firebase
  firebase_core: ^4.7.0
  firebase_remote_config: ^6.4.0
  firebase_crashlytics: ^5.2.0
  firebase_messaging: ^16.2.0
  firebase_analytics: ^12.3.0
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^3.0.2
  build_runner: ^2.12.2

flutter:
  generate: true
  uses-material-design: true
